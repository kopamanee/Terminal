<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Terminal AI - Trading Workspace</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: #151924;
            --bg-header: #131722;
            --bg-hover: #2a2e3d;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --accent-blue: #2962ff;
            --accent-purple: #8b5cf6;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-amber: #ff9800;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Prompt', 'JetBrains Mono', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            height: 54px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: #fff; }
        .brand-logo i { color: var(--accent-purple); font-size: 1.2rem; }

        .symbol-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-dark);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sym-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .sym-btn:hover { color: var(--text-main); background: var(--bg-hover); }
        .sym-btn.active { background: var(--accent-blue); color: #ffffff; }

        .header-nav-btns { display: flex; align-items: center; gap: 10px; }

        .ext-header-btn {
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .ext-header-btn:hover { background: var(--accent-purple); color: #fff; }

        .ext-header-btn.news {
            background: rgba(255, 152, 0, 0.15);
            color: var(--accent-amber);
            border-color: rgba(255, 152, 0, 0.4);
        }

        .ext-header-btn.news:hover { background: var(--accent-amber); color: #111; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 420px;
            height: calc(100vh - 54px);
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .workspace { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }

        .chart-wrapper { position: relative; width: 100%; height: 100%; background-color: var(--bg-dark); }
        #tv_chart_container { width: 100%; height: 100%; }

        .sidebar { background-color: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 14px 16px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center;}

        .sidebar-body { flex: 1; overflow-y: auto; padding: 16px; }

        .ai-card { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .ai-title { font-size: 0.82rem; font-weight: 700; color: var(--accent-purple); display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; text-transform: uppercase; }

        .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .score-card-mini { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; text-align: center; }
        .score-card-mini span { font-size: 0.68rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .score-card-mini strong { font-size: 0.95rem; font-family: 'JetBrains Mono', monospace; }

        .overall-score-box { background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(41, 98, 255, 0.15)); border: 1px solid var(--accent-purple); border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

        .btn-group-vertical { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

        .action-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            transition: transform 0.2s;
        }

        .action-link-btn.news-link {
            background: linear-gradient(90deg, #ff9800, #e91e63);
        }

        .action-link-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-brain"></i>
            <span>PRO TERMINAL AI</span>
        </div>

        <div class="symbol-switcher">
            <button class="sym-btn active" id="btn-btc" onclick="changeSymbol('BINANCE:BTCUSDT', 'btn-btc', 'BTCUSDT')">
                <i class="fa-brands fa-bitcoin" style="color: #f7931a;"></i> BTC/USDT
            </button>
            <button class="sym-btn" id="btn-gold" onclick="changeSymbol('TVC:GOLD', 'btn-gold', 'GOLD')">
                <i class="fa-solid fa-coins" style="color: var(--accent-amber);"></i> GOLD
            </button>
            <button class="sym-btn" id="btn-dxy" onclick="changeSymbol('CAPITALCOM:DXY', 'btn-dxy', 'DXY')">
                <i class="fa-solid fa-dollar-sign" style="color: var(--accent-blue);"></i> DXY
            </button>
            <button class="sym-btn" id="btn-oil" onclick="changeSymbol('TVC:USOIL', 'btn-oil', 'USOIL')">
                <i class="fa-solid fa-droplet" style="color: #e91e63;"></i> OIL
            </button>
        </div>

        <div class="header-nav-btns">
            <!-- Link 1: Macro Crypto Dashboard -->
            <a href="macro_crypto_dashboard.html?symbol=BTCUSDT" target="_blank" id="header-dash-link" class="ext-header-btn">
                <i class="fa-solid fa-gauge-high"></i> แดชบอร์ดวิเคราะห์เจาะลึก
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
            <!-- Link 2: AI News Hub -->
            <a href="news_dashboard.html" target="_blank" class="ext-header-btn news">
                <i class="fa-solid fa-newspaper"></i> ศูนย์ข่าว AI สด
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    </header>

    <div class="workspace">
        <div class="chart-wrapper">
            <div id="tv_chart_container"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <span><i class="fa-solid fa-robot" style="color: var(--accent-purple);"></i> AI INSIGHT OVERVIEW</span>
                <span id="ai-active-symbol" style="color: var(--accent-amber);">BTCUSDT</span>
            </div>

            <div class="sidebar-body">
                <div class="overall-score-box">
                    <div>
                        <div style="font-size: 0.72rem; color: var(--text-muted);">AI CONFIDENCE SCORE</div>
                        <div style="font-size: 1.1rem; font-weight: 700; color: #fff;" id="ai-overall-text">BULLISH</div>
                    </div>
                    <div>
                        <span style="font-size: 1.4rem; font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--accent-purple);" id="ai-overall-score">8.8/10</span>
                    </div>
                </div>

                <div class="score-grid">
                    <div class="score-card-mini"><span>📰 ข่าว</span><strong style="color: var(--accent-amber);" id="score-news">7.8/10</strong></div>
                    <div class="score-card-mini"><span>📊 เทคนิค</span><strong style="color: var(--accent-blue);" id="score-tech">9.0/10</strong></div>
                    <div class="score-card-mini"><span>🧱 โครงสร้าง</span><strong style="color: var(--accent-green);" id="score-struct">9.5/10</strong></div>
                </div>

                <div class="ai-card">
                    <div class="ai-title"><span><i class="fa-solid fa-brain"></i> สรุปมุมมอง AI ภาพรวม</span></div>
                    <div style="font-size: 0.78rem; line-height: 1.6;" id="ai-synthesis-text">Loading...</div>
                </div>

                <div class="btn-group-vertical">
                    <a href="macro_crypto_dashboard.html?symbol=BTCUSDT" target="_blank" id="ai-ext-dash-btn" class="action-link-btn">
                        <span><i class="fa-solid fa-chart-line"></i> ดูบทวิเคราะห์เจาะลึก 3 Timeframes</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>

                    <a href="news_dashboard.html" target="_blank" class="action-link-btn news-link">
                        <span><i class="fa-solid fa-newspaper"></i> เปิดศูนย์ข่าว AI & แปลวิเคราะห์สด</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSymbolKey = 'BTCUSDT';

        const aiDatabase = {
            'BTCUSDT': { symbol: 'BTC/USDT', overallText: 'BULLISH', overallScore: '8.8/10', news: '7.8/10', tech: '9.0/10', struct: '9.5/10', synthesis: '📌 <strong>กระแสเงินทุน:</strong> ไหลเข้า Spot ETF ต่อเนื่อง<br>📌 <strong>เทคนิค:</strong> ราคายก Higher Low บน Timeframe H1 ชัดเจน ย่อ Buy บริเวณ Order Block มีอัตรา Winrate สูง' },
            'GOLD': { symbol: 'GOLD (XAU/USD)', overallText: 'SIDEWAY UP', overallScore: '8.2/10', news: '8.5/10', tech: '8.0/10', struct: '8.2/10', synthesis: '📌 <strong>ภาพรวม:</strong> ได้แรงหนุนจากความเสี่ยงภูมิรัฐศาสตร์โลก<br>📌 <strong>เทคนิค:</strong> วิ่งสะสมกำลังในกรอบ $2,390 - $2,430 หาจังหวะย่อ Buy ที่ขอบล่างกรอบ' },
            'DXY': { symbol: 'DXY INDEX', overallText: 'BEARISH', overallScore: '7.9/10', news: '8.2/10', tech: '7.8/10', struct: '7.6/10', synthesis: '📌 <strong>นโยบาย:</strong> คาดการณ์ปรับลดดอกเบี้ยกดดันค่าเงินดอลลาร์<br>📌 <strong>เทคนิค:</strong> ทำ Lower Low ต่อเนื่อง เด้งทดสอบ Supply Zone เน้นเปิด Sell' },
            'USOIL': { symbol: 'US OIL (WTI)', overallText: 'SIDEWAY', overallScore: '7.5/10', news: '7.0/10', tech: '7.8/10', struct: '7.7/10', synthesis: '📌 <strong>เศรษฐกิจ:</strong> กังวลเรื่อง Demand พลังงานชะลอตัว<br>📌 <strong>เทคนิค:</strong> แกว่งตัวในกรอบ $76.50 - $80.00 แนะนำ Swing Trade ตามกรอบ' }
        };

        function loadTradingViewWidget(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Asia/Bangkok",
                "theme": "dark",
                "style": "1",
                "locale": "th_TH",
                "container_id": "tv_chart_container"
            });
        }

        function changeSymbol(symbol, btnId, symbolKey) {
            if (btnId) {
                document.querySelectorAll('.sym-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(btnId).classList.add('active');
            }
            loadTradingViewWidget(symbol);
            if(symbolKey && aiDatabase[symbolKey]) {
                currentSymbolKey = symbolKey;
                updateUI(symbolKey);
            }
        }

        function updateUI(key) {
            const data = aiDatabase[key];
            document.getElementById('ai-active-symbol').innerText = data.symbol;
            document.getElementById('ai-overall-text').innerText = data.overallText;
            document.getElementById('ai-overall-score').innerText = data.overallScore;
            document.getElementById('score-news').innerText = data.news;
            document.getElementById('score-tech').innerText = data.tech;
            document.getElementById('score-struct').innerText = data.struct;
            document.getElementById('ai-synthesis-text').innerHTML = data.synthesis;

            // Sync link for Macro Crypto Dashboard
            const dashUrl = `macro_crypto_dashboard.html?symbol=${key}`;
            document.getElementById('header-dash-link').href = dashUrl;
            document.getElementById('ai-ext-dash-btn').href = dashUrl;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTradingViewWidget('BINANCE:BTCUSDT');
            updateUI('BTCUSDT');
        });
    </script>
</body>
</html>
