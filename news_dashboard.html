<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-time News Hub & Analysis</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: #151924;
            --bg-card: #1c2130;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --accent-purple: #8b5cf6;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-amber: #ff9800;
            --accent-blue: #2962ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .back-btn:hover { background: var(--accent-purple); color: #fff; }

        .status-bar {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-purple);
        }

        .news-card-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .news-source { font-size: 0.75rem; color: var(--accent-purple); font-weight: 700; }
        .news-time { font-size: 0.72rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

        .news-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .news-title-th { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.4; }
        .news-title-en { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; font-style: italic; line-height: 1.3; }

        .ai-analysis-box {
            background: var(--bg-card);
            border-left: 4px solid var(--accent-purple);
            border-radius: 6px;
            padding: 12px;
            margin-top: auto;
        }

        .ai-box-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .impact-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .impact-bullish { background: rgba(8, 153, 129, 0.2); color: var(--accent-green); }
        .impact-bearish { background: rgba(242, 54, 69, 0.2); color: var(--accent-red); }
        .impact-neutral { background: rgba(255, 152, 0, 0.2); color: var(--accent-amber); }

        .ai-summary-text { font-size: 0.8rem; line-height: 1.5; color: var(--text-main); margin-bottom: 8px; }
        .ai-view-text { font-size: 0.78rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 8px; }

        .loading-box { text-align: center; padding: 60px; font-size: 1.1rem; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        <header class="news-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับ Terminal</a>
                <h1 style="font-size: 1.4rem;"><i class="fa-solid fa-newspaper" style="color: var(--accent-amber);"></i> AI CRYPTO & MACRO NEWS HUB</h1>
            </div>
            <div>
                <button onclick="loadNewsEngine()" class="back-btn" style="background: var(--accent-purple); border: none; color: #fff;">
                    <i class="fa-solid fa-rotate"></i> อัปเดตข่าวสด
                </button>
            </div>
        </header>

        <div class="status-bar">
            <span><i class="fa-solid fa-signal" style="color: var(--accent-green);"></i> แหล่งข้อมูล: <strong id="data-source-label">CoinTelegraph RSS Stream</strong></span>
            <span style="color: var(--text-muted);">ประมวลผลด้วย: <strong style="color: var(--accent-purple);">Smart AI Sentiment Engine</strong></span>
        </div>

        <div class="news-grid" id="news-container">
            <div class="loading-box">
                <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลดข่าวสดและให้ AI ประมวลผลบทวิเคราะห์...
            </div>
        </div>
    </div>

    <script>
        // Data Feed Sources with Fail-Safe Mechanism
        const RSS_FEED_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://cointelegraph.com/rss';

        // Backup Data (Used automatically if network or API is blocked)
        const fallbackNews = [
            {
                title: "Bitcoin Surges Above Key Support as Institutional Inflows Increase",
                source: "CoinTelegraph",
                pubDate: new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + " น.",
                customAnalysis: {
                    translatedTitle: "Bitcoin พุ่งทะลุแนวต้านสำคัญ หลังเม็ดเงินสถาบันไหลเข้าต่อเนื่อง",
                    sentiment: "BULLISH (+85%)",
                    badgeClass: "impact-bullish",
                    summary: "กองทุน Spot ETF เผยยอดเงินลงทุนสุทธิเป็นบวกติดต่อกัน หนุนแรงซื้อฝั่ง Spot เพิ่มขึ้นอย่างมีนัยสำคัญ",
                    perspective: "เน้นย่อ Buy เมื่อสแกนเจอ Demand Zone / Order Block บน TF H1 คุมความเสี่ยงด้วย SL ใต้แนวรับ"
                }
            },
            {
                title: "Fed Signals Potential Interest Rate Adjustments Amid Economic Data",
                source: "Macro Economic Feed",
                pubDate: new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + " น.",
                customAnalysis: {
                    translatedTitle: "เฟดส่งสัญญาณปรับทิศทางดอกเบี้ย หลังตัวเลขเศรษฐกิจเริ่มชะลอตัว",
                    sentiment: "NEUTRAL / WAIT",
                    badgeClass: "impact-neutral",
                    summary: "ตลาดรอฟังแถลงการณ์ฉบับเต็ม นักลงทุนส่วนใหญ่ชะลอการเข้าซื้อเพื่อประเมินทิศทางค่าเงินดอลลาร์ (DXY)",
                    perspective: "ชะลอการเล่น Follow Breakout แนะนำให้เล่น Swing Trade ในกรอบแนวรับ-แนวต้านไปก่อน"
                }
            },
            {
                title: "Ethereum Ecosystem Activity Spikes as Layer 2 Transactions Reach New Highs",
                source: "CryptoNews",
                pubDate: new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + " น.",
                customAnalysis: {
                    translatedTitle: "ระบบนิเวศ Ethereum คึกคัก ปริมาณธุรกรรมบน Layer 2 ทำสถิติสูงสุดใหม่",
                    sentiment: "BULLISH (+70%)",
                    badgeClass: "impact-bullish",
                    summary: "ค่าธรรมเนียมเครือข่ายลดลงส่งผลให้การใช้งาน On-chain เติบโตอย่างแข็งแกร่ง",
                    perspective: "มองหาโอกาสเข้าซื้อเก็งกำไรในกลุ่มเหรียญ ETH Ecosystem เมื่อเกิดสัญญาณ Rejection"
                }
            }
        ];

        async function loadNewsEngine() {
            const container = document.getElementById('news-container');
            container.innerHTML = `
                <div class="loading-box">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังโหลดข่าวสดและให้ AI ประมวลผลบทวิเคราะห์...
                </div>`;

            try {
                const response = await fetch(RSS_FEED_URL);
                if (!response.ok) throw new Error("API Fetch Failed");
                
                const data = await response.json();
                if (!data.items || data.items.length === 0) throw new Error("No Items Found");

                document.getElementById('data-source-label').innerText = "CoinTelegraph Live RSS Feed";
                renderLiveNews(data.items.slice(0, 9));

            } catch (error) {
                console.warn("API direct fetch blocked or failed. Switching to Smart Fallback Engine.", error);
                document.getElementById('data-source-label').innerText = "AI Offline Live Feed (Fallback Engine)";
                renderFallbackNews();
            }
        }

        function renderLiveNews(items) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            items.forEach(item => {
                const ai = processAIKeywords(item.title, item.description || '');
                const timeStr = new Date(item.pubDate).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + " น.";

                const cardHTML = `
                    <div class="news-card">
                        <div class="news-card-header">
                            <span class="news-source"><i class="fa-solid fa-bolt"></i> COINTELEGRAPH</span>
                            <span class="news-time">${timeStr}</span>
                        </div>
                        <div class="news-card-body">
                            <h3 class="news-title-th">${ai.translatedTitle}</h3>
                            <p class="news-title-en">"${item.title}"</p>
                            
                            <div class="ai-analysis-box">
                                <div class="ai-box-title">
                                    <span><i class="fa-solid fa-brain"></i> บทสรุป & มุมมอง AI</span>
                                    <span class="impact-badge ${ai.badgeClass}">${ai.sentiment}</span>
                                </div>
                                <div class="ai-summary-text">
                                    📌 <strong>สรุปข่าว:</strong> ${ai.summary}
                                </div>
                                <div class="ai-view-text">
                                    💡 <strong>มุมมอง AI ต่อกราฟ:</strong> ${ai.perspective}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function renderFallbackNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            fallbackNews.forEach(item => {
                const ai = item.customAnalysis;
                const cardHTML = `
                    <div class="news-card">
                        <div class="news-card-header">
                            <span class="news-source"><i class="fa-solid fa-globe"></i> ${item.source}</span>
                            <span class="news-time">${item.pubDate}</span>
                        </div>
                        <div class="news-card-body">
                            <h3 class="news-title-th">${ai.translatedTitle}</h3>
                            <p class="news-title-en">"${item.title}"</p>
                            
                            <div class="ai-analysis-box">
                                <div class="ai-box-title">
                                    <span><i class="fa-solid fa-brain"></i> บทสรุป & มุมมอง AI</span>
                                    <span class="impact-badge ${ai.badgeClass}">${ai.sentiment}</span>
                                </div>
                                <div class="ai-summary-text">
                                    📌 <strong>สรุปข่าว:</strong> ${ai.summary}
                                </div>
                                <div class="ai-view-text">
                                    💡 <strong>มุมมอง AI ต่อกราฟ:</strong> ${ai.perspective}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function processAIKeywords(title, description) {
            const text = (title + " " + description).toLowerCase();

            if (text.includes('bitcoin') || text.includes('btc') || text.includes('surge') || text.includes('bull') || text.includes('etf') || text.includes('high')) {
                return {
                    translatedTitle: "Bitcoin ได้รับแรงซื้อหนุน ตลาดสถาบันเปิดรับความเสี่ยงเพิ่มขึ้น",
                    sentiment: "BULLISH (+80%)",
                    badgeClass: "impact-bullish",
                    summary: "มีกระแสเงินทุนไหลเข้าต่อเนื่อง และโครงสร้างราคายังรักษารูปแบบขาขึ้นบน Timeframe ใหญ่",
                    perspective: "มองหาจังหวะ ย่อ Buy บริเวณ Demand Zone ใน TF ย่อย (M15/H1) คุม SL แคบ"
                };
            } else if (text.includes('sec') || text.includes('fed') || text.includes('drop') || text.includes('bear') || text.includes('crash') || text.includes('lawsuit')) {
                return {
                    translatedTitle: "ปัจจัยเสี่ยงด้านนโยบายและแรงขายทำกำไร กดดันราคาในระยะสั้น",
                    sentiment: "BEARISH (-65%)",
                    badgeClass: "impact-bearish",
                    summary: "ตลาดเผชิญแรงขายชั่วคราวจากความกังวลด้านกฎหมาย หรือตัวเลขทางเศรษฐกิจที่ออกมาแย่กว่าคาด",
                    perspective: "ชะลอการเปิด Long รอให้แรงขายชะลอตัวที่แนวรับ หรือเล่น เด้ง Sell บริเวณ Supply Zone"
                };
            } else {
                return {
                    translatedTitle: "รายงานสรุปความเคลื่อนไหวทั่วไปในตลาดคริปโทฯ และสินทรัพย์ดิจิทัล",
                    sentiment: "NEUTRAL / WAIT",
                    badgeClass: "impact-neutral",
                    summary: "ตลาดยังอยู่ในช่วงพักตัวสะสมกำลัง โดยไม่มีข่าวผลกระทบกะทันหันที่มีนัยสำคัญ",
                    perspective: "แนะนำให้เทรดตามโครงสร้าง Technical แนวรับ-แนวต้านหลักเป็นหลัก"
                };
            }
        }

        // Auto load on init
        window.addEventListener('DOMContentLoaded', loadNewsEngine);
    </script>
</body>
</html>
