<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real-time News Hub & Analysis</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: #151924;
            --bg-card: #1c2130;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --accent-purple: #8b5cf6;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-amber: #ff9800;
            --accent-blue: #2962ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* Navigation Header */
        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover { background: var(--accent-purple); color: #fff; }

        /* API Control Bar */
        .api-bar {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .api-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        .api-input-group input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }

        /* News Cards Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-purple);
        }

        .news-card-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.15);
        }

        .news-source { font-size: 0.75rem; color: var(--accent-purple); font-weight: 700; text-transform: uppercase; }
        .news-time { font-size: 0.72rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

        .news-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .news-title-th { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.4; }
        .news-title-en { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; font-style: italic; line-height: 1.3; }

        /* AI Analysis Box */
        .ai-analysis-box {
            background: var(--bg-card);
            border-left: 4px solid var(--accent-purple);
            border-radius: 6px;
            padding: 12px;
            margin-top: auto;
        }

        .ai-box-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .impact-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .impact-bullish { background: rgba(8, 153, 129, 0.2); color: var(--accent-green); }
        .impact-bearish { background: rgba(242, 54, 69, 0.2); color: var(--accent-red); }
        .impact-neutral { background: rgba(255, 152, 0, 0.2); color: var(--accent-amber); }

        .ai-summary-text { font-size: 0.8rem; line-height: 1.5; color: var(--text-main); margin-bottom: 8px; }
        .ai-view-text { font-size: 0.78rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 8px; line-height: 1.4; }

        .loading-box { text-align: center; padding: 60px; font-size: 1.1rem; color: var(--text-muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Nav -->
        <header class="news-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับ Terminal</a>
                <h1 style="font-size: 1.4rem;"><i class="fa-solid fa-newspaper" style="color: var(--accent-amber);"></i> AI CRYPTO & MACRO NEWS HUB</h1>
            </div>
            <div>
                <button onclick="fetchLiveNews()" class="back-btn" style="cursor: pointer; background: var(--accent-purple); border: none; color: #fff;">
                    <i class="fa-solid fa-rotate"></i> ดึงข่าวสดล่าสุด
                </button>
            </div>
        </header>

        <!-- Optional Gemini API Control -->
        <div class="api-bar">
            <div class="api-input-group">
                <i class="fa-solid fa-key" style="color: var(--accent-purple);"></i>
                <span style="font-size: 0.8rem; white-space: nowrap;">Gemini API Key (Option):</span>
                <input type="password" id="gemini-key-input" placeholder="วาง API Key เพื่อใช้ LLM สรุปสด (ถ้าไม่มีระบบจะใช้ Smart Rule Engine)" onchange="saveApiKey()">
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">
                สถานะ AI: <strong id="ai-status-label" style="color: var(--accent-green);">Smart Rule Engine (พร้อมทำงาน)</strong>
            </div>
        </div>

        <!-- News Cards Grid Container -->
        <div class="news-grid" id="news-container">
            <div class="loading-box">
                <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังดึงข่าวสดล่าสุดจากต่างประเทศ และให้ AI ประมวลผล...
            </div>
        </div>
    </div>

    <script>
        // Save and Load API Key
        function saveApiKey() {
            const key = document.getElementById('gemini-key-input').value;
            localStorage.setItem('GEMINI_KEY', key);
            updateAiStatus();
        }

        function updateAiStatus() {
            const key = localStorage.getItem('GEMINI_KEY');
            const label = document.getElementById('ai-status-label');
            if (key) {
                label.innerText = 'Gemini LLM API (เชื่อมต่อแล้ว)';
                label.style.color = 'var(--accent-purple)';
            } else {
                label.innerText = 'Smart Rule Engine (พร้อมทำงาน)';
                label.style.color = 'var(--accent-green)';
            }
        }

        // Fetch Real-time Crypto & Financial News
        async function fetchLiveNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = `
                <div class="loading-box">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังดึงข่าวสดล่าสุดจากสำนักข่าวต่างประเทศ และวิเคราะห์ผลกระทบกราฟ...
                </div>`;

            try {
                // CryptoCompare Public Realtime News Endpoint
                const response = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN');
                const data = await response.json();
                const articles = data.Data.slice(0, 9); // Load latest 9 articles

                container.innerHTML = '';

                for (let article of articles) {
                    const apiKey = localStorage.getItem('GEMINI_KEY');
                    let aiAnalysis;

                    if (apiKey) {
                        aiAnalysis = await analyzeWithGeminiAPI(article.title, article.body, apiKey);
                    } else {
                        aiAnalysis = analyzeWithRuleEngine(article.title, article.body);
                    }

                    const cardHTML = `
                        <div class="news-card">
                            <div class="news-card-header">
                                <span class="news-source"><i class="fa-solid fa-globe"></i> ${article.source_info.name}</span>
                                <span class="news-time">${new Date(article.published_on * 1000).toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'})} น.</span>
                            </div>
                            <div class="news-card-body">
                                <h3 class="news-title-th">${aiAnalysis.translatedTitle}</h3>
                                <p class="news-title-en">"${article.title}"</p>
                                
                                <div class="ai-analysis-box">
                                    <div class="ai-box-title">
                                        <span><i class="fa-solid fa-brain"></i> บทวิเคราะห์ & มุมมอง AI</span>
                                        <span class="impact-badge ${aiAnalysis.badgeClass}">${aiAnalysis.sentiment}</span>
                                    </div>
                                    <div class="ai-summary-text">
                                        📌 <strong>สรุปข่าว:</strong> ${aiAnalysis.summary}
                                    </div>
                                    <div class="ai-view-text">
                                        💡 <strong>มุมมอง AI ต่อกราฟ:</strong> ${aiAnalysis.perspective}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                }

            } catch (error) {
                container.innerHTML = `<div class="loading-box" style="color: var(--accent-red);">เกิดข้อผิดพลาดในการโหลดข่าว กรุณากดปุ่มอัปเดตใหม่อีกครั้ง</div>`;
            }
        }

        // Live Gemini API Processing (If user provided API Key)
        async function analyzeWithGeminiAPI(title, body, apiKey) {
            try {
                const prompt = `แปลและวิเคราะห์ข่าวการเงิน/คริปโทฯ นี้เป็นภาษาไทยสำหรับนักเทรด:
                Title: ${title}
                Body: ${body}

                ตอบเป็นรูปแบบ JSON ดังนี้เท่านั้น:
                {
                  "translatedTitle": "หัวข้อข่าวภาษาไทยที่กระชับน่าอ่าน",
                  "sentiment": "BULLISH (+XX%) หรือ BEARISH (-XX%) หรือ NEUTRAL",
                  "badgeClass": "impact-bullish หรือ impact-bearish หรือ impact-neutral",
                  "summary": "สรุปเนื้อหาสำคัญ 1-2 ประโยค",
                  "perspective": "คำแนะนำเชิงเทคนิคสั้นๆ เช่น ให้รอ Buy ที่แนวรับ หรือระวังแรงขาย"
                }`;

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await res.json();
                const textResp = data.candidates[0].content.parts[0].text;
                const cleanJson = textResp.replace(/```json|```/g, '').trim();
                return JSON.parse(cleanJson);
            } catch (e) {
                return analyzeWithRuleEngine(title, body); // Fallback on error
            }
        }

        // Fast Offline / Fallback Rule-based AI Engine
        function analyzeWithRuleEngine(title, body) {
            const text = (title + " " + body).toLowerCase();
            
            let sentiment = 'NEUTRAL / WAIT';
            let badgeClass = 'impact-neutral';
            let perspective = 'ข่าวนี้เป็นปัจจัยกลางๆ ตลาดกำลังรอปัจจัยใหม่ แนะนำเทรดตามโครงสร้าง Technical แนวรับ-แนวต้านเดิม';
            let summary = 'มีการรายงานความเคลื่อนไหวทั่วไปในตลาด ผู้เล่นส่วนใหญ่ยังชะลอการลงทุนเพื่อรอความชัดเจน';
            let translatedTitle = "รายงานสรุปสถานการณ์ความเคลื่อนไหวล่าสุดในตลาด";

            if (text.includes('bitcoin') || text.includes('btc') || text.includes('etf') || text.includes('bull') || text.includes('surge') || text.includes('rise') || text.includes('gain')) {
                translatedTitle = "Bitcoin & ตลาดคริปโทฯ ได้รับแรงหนุน เม็ดเงินไหลเข้าสะสมต่อเนื่อง";
                sentiment = 'BULLISH (+80%)';
                badgeClass = 'impact-bullish';
                summary = 'มีสัญญาณซื้อจากนักลงทุนสถาบันและความเชื่อมั่นเชิงบวก ผลักดันราคาทำโครงสร้างยก High ใหม่';
                perspective = 'แนวโน้มเป็นขาขึ้นชัดเจน มองหาจังหวะ ย่อ Buy เมื่อราคาพักตัวลงมาทดสอบ Demand Zone หรือ Order Block ใน TF ย่อย';
            } 
            else if (text.includes('fed') || text.includes('rate') || text.includes('inflation') || text.includes('sec') || text.includes('drop') || text.includes('fall') || text.includes('crash') || text.includes('ban')) {
                translatedTitle = "ตลาดเผชิญแรงกดดัน ปัจจัยเสี่ยงนโยบายการเงินและความผันผวนระยะสั้น";
                sentiment = 'BEARISH (-70%)';
                badgeClass = 'impact-bearish';
                summary = 'เกิดแรงขายกดดันจากความกังวลเรื่องกฎหมาย ตัวเลขเศรษฐกิจ หรืออัตราดอกเบี้ย';
                perspective = 'ระวังแรงขายทะลุแนวรับสำคัญ ชะลอการเปิดสัญญา Long และเน้นเด้ง Sell บริเวณ Supply Zone จนกว่าจะมีแรงซื้อสวน';
            }

            return { translatedTitle, sentiment, badgeClass, summary, perspective };
        }

        // Init Page
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('GEMINI_KEY');
            if (savedKey) document.getElementById('gemini-key-input').value = savedKey;
            updateAiStatus();
            fetchLiveNews();
        });
    </script>
</body>
</html>
