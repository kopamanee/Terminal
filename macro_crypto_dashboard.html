<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-panel: #151924;
            --bg-card: #1c2130;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --accent-purple: #8b5cf6;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-amber: #ff9800;
            --accent-blue: #2962ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Navigation Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover { background: var(--accent-purple); color: #fff; }

        .symbol-selector {
            display: flex;
            gap: 8px;
            background: var(--bg-dark);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sym-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sym-btn.active { background: var(--accent-purple); color: #fff; }

        /* Consensus Bar */
        .consensus-bar {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(41, 98, 255, 0.1));
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .consensus-title { font-size: 1.1rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .consensus-score-box { text-align: right; }
        .consensus-badge { padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }

        /* Experts Grid */
        .experts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .expert-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .expert-card:hover { transform: translateY(-4px); border-color: var(--accent-purple); }

        .expert-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .expert-info { display: flex; align-items: center; gap: 12px; }
        .expert-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .expert-name { font-weight: 700; font-size: 0.95rem; color: #fff; }
        .expert-style { font-size: 0.72rem; color: var(--text-muted); }

        .signal-tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .bg-bullish { background: rgba(8, 153, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .bg-bearish { background: rgba(242, 54, 69, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .bg-neutral { background: rgba(255, 152, 0, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-purple);
            text-transform: uppercase;
            margin-top: 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .analysis-text { font-size: 0.82rem; line-height: 1.5; color: var(--text-main); }

        .levels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }

        .level-box { display: flex; flex-direction: column; }
        .level-label { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 2px; }

        .pro-con-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.75rem;
        }

        .pro-list { color: var(--accent-green); }
        .con-list { color: var(--accent-red); }
        .pro-con-item { margin-bottom: 4px; line-height: 1.3; }

        @media (max-width: 768px) {
            .experts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                            <div class="level-box">
                                <span class="level-label"><i class="fa-solid fa-shield-halved" style="color: var(--accent-green);"></i> แนวรับ (Support)</span>
                                <strong style="color: var(--accent-green);">${exp.support}</strong>
                            </div>
                            <div class="level-box">
                                <span class="level-label"><i class="fa-solid fa-hand" style="color: var(--accent-red);"></i> แนวต้าน (Resistance)</span>
                                <strong style="color: var(--accent-red);">${exp.resistance}</strong>
                            </div>
                        </div>

                        <div class="pro-con-box">
                            <div>
                                <div style="font-weight: 700; color: var(--accent-green); margin-bottom: 4px;">💪 จุดแข็ง/ข้อดี</div>
                                ${exp.strengths.map(s => `<div class="pro-con-item pro-list">• ${s}</div>`).join('')}
                            </div>
                            <div>
                                <div style="font-weight: 700; color: var(--accent-red); margin-bottom: 4px;">⚠️ จุดอ่อน/ความเสี่ยง</div>
                                ${exp.weaknesses.map(w => `<div class="pro-con-item con-list">• ${w}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function selectSymbol(sym) {
            document.querySelectorAll('.sym-btn').forEach(btn => btn.classList.remove('active'));
            if(sym === 'BTCUSDT') document.getElementById('btn-btc').classList.add('active');
            if(sym === 'GOLD') document.getElementById('btn-gold').classList.add('active');
            if(sym === 'DXY') document.getElementById('btn-dxy').classList.add('active');

            renderDesk(sym);
        }

        // Auto read URL query parameter e.g., macro_crypto_dashboard.html?symbol=GOLD
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const symParam = urlParams.get('symbol') || 'BTCUSDT';
            selectSymbol(symParam);
        });
    </script>
</body>
</html>
